set timeout=5
set root='hd0,msdos1'
insmod part_msdos
insmod ext2

menuentry 'GNU' {
	set root='hd0,msdos1'

	echo 'Loading GNU Mach'
	multiboot /boot/gnumach console=com0 root=part:1:device:wd0 noide

	echo 'Loading the Hurd'

	echo 'Creating the /hurd/pci-arbiter.static task'
	module /hurd/pci-arbiter.static pci-arbiter \
		--host-priv-port='${host-port}' --device-master-port='${device-port}' \
		--next-task='${acpi-task}' \
		'$(pci-task=task-create)' '$(task-resume)'

	echo 'Creating the /hurd/acpi.static task'
	module /hurd/acpi.static acpi \
		--next-task='${disk-task}' \
		'$(acpi-task=task-create)'

	echo 'Creating the /hurd/rumpdisk.static task'
	module /hurd/rumpdisk.static rumpdisk \
		--next-task='${fs-task}' \
		'$(disk-task=task-create)'

	echo 'Creating the /hurd/ext2fs.static task'
	module /hurd/ext2fs.static ext2fs \
		--multiboot-command-line='${kernel-command-line}' \
		--exec-server-task='${exec-task}' \
		-T typed '${root}' \
		'$(fs-task=task-create)'
	
	echo 'Creating the /hurd/exec task'
	module /lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
}
